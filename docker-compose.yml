version: '3.8'

services:
  web:
    build: .
    container_name: voice_banking_assistant
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-120b}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./voice_bank.db}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
    volumes:
      - ./voice_bank.db:/app/voice_bank.db
    restart: unless-stopped
